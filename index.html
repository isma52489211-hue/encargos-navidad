<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encargos de Navidad</title>

  <!-- Instalable en el móvil -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#9f1d1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Encargos">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <style>
    :root {
      --rojo: #9f1d1d;
      --rojo-oscuro: #7a1414;
      --fondo: #f5f1ea;
      --tarjeta: #ffffff;
      --texto: #222222;
      --gris: #666666;
      --borde: #d9d2c7;
      --error: #b00020;
      --verde: #2e7d32;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      line-height: 1.4;
    }

    header {
      background: var(--rojo);
      color: #ffffff;
      padding: 16px;
      text-align: center;
    }

    header h1 { margin: 0; font-size: 1.5rem; }
    header p { margin: 4px 0 0; font-size: 0.95rem; opacity: 0.9; }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px;
    }

    .tarjeta {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 1.2rem;
      margin: 0 0 12px;
      color: var(--rojo-oscuro);
    }

    .campo { margin-bottom: 14px; }

    label.etiqueta {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="tel"],
    input[type="number"],
    input[type="date"],
    select {
      width: 100%;
      font-size: 16px; /* evita el zoom automático en iPhone */
      padding: 10px;
      border: 1px solid var(--borde);
      border-radius: 6px;
      background: #ffffff;
      color: var(--texto);
    }

    input:focus, select:focus {
      outline: 2px solid var(--rojo);
      outline-offset: 1px;
    }

    input[aria-invalid="true"], select[aria-invalid="true"] {
      border-color: var(--error);
      background: #fff5f5;
    }

    .error {
      color: var(--error);
      font-size: 0.875rem;
      margin: 4px 0 0;
      min-height: 0;
    }

    .casilla {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      font-weight: 600;
      cursor: pointer;
    }

    .casilla input {
      width: 22px;
      height: 22px;
    }

    .ayuda {
      font-size: 0.85rem;
      color: var(--gris);
      margin: 0 0 14px;
    }

    button {
      width: 100%;
      font-size: 1.05rem;
      font-weight: 600;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--rojo);
      color: #ffffff;
      cursor: pointer;
    }

    button:hover { background: var(--rojo-oscuro); }

    .aviso {
      margin-top: 10px;
      font-size: 0.95rem;
      color: var(--error);
    }

    .vacio {
      color: var(--gris);
      margin: 0;
    }

    ul.lista {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li.encargo {
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      background: #ffffff;
    }

    .encargo-cabecera {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .encargo-cabecera strong { font-size: 1.05rem; }

    .fecha {
      font-weight: 700;
      color: var(--rojo-oscuro);
      white-space: nowrap;
    }

    .encargo-detalle {
      font-size: 0.95rem;
      margin: 2px 0;
    }

    .etiqueta-estado {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      background: #fff3cd;
      color: #7a5a00;
      margin-top: 6px;
    }

    .senal-si { color: var(--verde); font-weight: 600; }
    .senal-no { color: var(--gris); }

    .barra {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .barra button {
      width: auto;
      font-size: 0.95rem;
      padding: 8px 14px;
    }

    .barra button:disabled {
      background: #bdb6ab;
      cursor: not-allowed;
    }

    .boton-secundario {
      background: #ffffff !important;
      color: var(--texto) !important;
      border: 1px solid var(--borde);
    }

    .confirmacion-borrado {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--error);
    }

    .fila-seleccion {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--gris);
      margin-bottom: 6px;
      cursor: pointer;
    }

    .fila-seleccion input {
      width: 20px;
      height: 20px;
    }

    @media (min-width: 480px) {
      .fila-doble {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Encargos de Navidad</h1>
    <p>Pescadería · Baena · Luque · Zuheros · Doña Mencía</p>
  </header>

  <main>

    <section class="tarjeta" aria-labelledby="titulo-form">
      <h2 id="titulo-form">Nuevo encargo</h2>
      <p class="ayuda">Los campos marcados con * son obligatorios.</p>

      <form id="formulario" novalidate>

        <div class="campo">
          <label class="etiqueta" for="nombre">Nombre del cliente *</label>
          <input type="text" id="nombre" name="nombre" autocomplete="off">
          <p class="error" id="error-nombre" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label class="etiqueta" for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" autocomplete="off">
        </div>

        <div class="campo">
          <label class="etiqueta" for="tienda">Tienda *</label>
          <select id="tienda" name="tienda">
            <option value="Baena">Baena</option>
            <option value="Luque">Luque</option>
            <option value="Zuheros">Zuheros</option>
            <option value="Doña Mencía">Doña Mencía</option>
          </select>
        </div>

        <div class="campo">
          <label class="etiqueta" for="producto">Producto *</label>
          <input type="text" id="producto" name="producto" autocomplete="off">
          <p class="error" id="error-producto" aria-live="polite"></p>
        </div>

        <div class="fila-doble">
          <div class="campo">
            <label class="etiqueta" for="kg">Cantidad (kg) *</label>
            <input type="number" id="kg" name="kg" step="any" min="0" inputmode="decimal">
            <p class="error" id="error-kg" aria-live="polite"></p>
          </div>

          <div class="campo">
            <label class="etiqueta" for="fecha">Fecha de recogida *</label>
            <input type="date" id="fecha" name="fecha">
            <p class="error" id="error-fecha" aria-live="polite"></p>
          </div>
        </div>

        <div class="campo">
          <label class="casilla" for="senal">
            <input type="checkbox" id="senal" name="senal">
            Señal pagada
          </label>
        </div>

        <button type="submit">Guardar encargo</button>
        <p class="aviso" id="aviso" role="status"></p>
      </form>
    </section>

    <section aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Encargos (<span id="contador">0</span>)</h2>
      <p class="vacio" id="vacio">Todavía no hay encargos guardados.</p>
      <div class="barra" id="barra">
        <button type="button" id="btn-borrar" disabled>Borrar seleccionados (0)</button>
        <span id="confirmacion" hidden>
          <span class="confirmacion-borrado">¿Borrar los seleccionados?</span>
          <button type="button" id="btn-confirmar-borrar">Sí, borrar</button>
          <button type="button" id="btn-cancelar-borrar" class="boton-secundario">Cancelar</button>
        </span>
      </div>
      <ul class="lista" id="lista"></ul>
    </section>

  </main>

  <script>
    // ---------- Configuración ----------
    const CLAVE_STORAGE = 'encargosNavidad.v1';

    // ---------- Referencias a elementos ----------
    const formulario = document.getElementById('formulario');
    const lista = document.getElementById('lista');
    const vacio = document.getElementById('vacio');
    const contador = document.getElementById('contador');
    const aviso = document.getElementById('aviso');
    const btnBorrar = document.getElementById('btn-borrar');
    const confirmacion = document.getElementById('confirmacion');
    const btnConfirmarBorrar = document.getElementById('btn-confirmar-borrar');
    const btnCancelarBorrar = document.getElementById('btn-cancelar-borrar');

    const campos = {
      nombre: document.getElementById('nombre'),
      telefono: document.getElementById('telefono'),
      tienda: document.getElementById('tienda'),
      producto: document.getElementById('producto'),
      kg: document.getElementById('kg'),
      fecha: document.getElementById('fecha'),
      senal: document.getElementById('senal')
    };

    // Campos que tienen mensaje de error propio (los demás no se validan)
    const CAMPOS_VALIDADOS = ['nombre', 'producto', 'kg', 'fecha'];

    // ---------- Estado: array de encargos ----------
    let encargos = cargarEncargos();

    // Ids de los encargos marcados para borrar (solo en memoria, no se guardan)
    const seleccionados = new Set();

    // ---------- Almacenamiento (localStorage) ----------
    function cargarEncargos() {
      try {
        const texto = localStorage.getItem(CLAVE_STORAGE);
        if (!texto) return [];
        const datos = JSON.parse(texto);
        return Array.isArray(datos) ? datos : [];
      } catch (error) {
        console.error('No se pudieron leer los encargos guardados:', error);
        return [];
      }
    }

    function guardarEncargos() {
      try {
        localStorage.setItem(CLAVE_STORAGE, JSON.stringify(encargos));
        return true;
      } catch (error) {
        console.error('No se pudieron guardar los encargos:', error);
        return false;
      }
    }

    // ---------- Utilidades ----------
    function generarId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    }

    function escaparHtml(texto) {
      return String(texto)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Convierte "2026-12-22" en "22/12/2026" sin pasar por Date (evita desfases de zona horaria)
    function formatearFecha(fechaIso) {
      const [anio, mes, dia] = fechaIso.split('-');
      return dia + '/' + mes + '/' + anio;
    }

    // ---------- Validación ----------
    function mostrarError(campo, mensaje) {
      const input = campos[campo];
      const p = document.getElementById('error-' + campo);
      p.textContent = mensaje;
      input.setAttribute('aria-invalid', 'true');
    }

    function limpiarError(campo) {
      const input = campos[campo];
      const p = document.getElementById('error-' + campo);
      p.textContent = '';
      input.removeAttribute('aria-invalid');
    }

    function validarFormulario() {
      const errores = {};

      if (campos.nombre.value.trim() === '') {
        errores.nombre = 'Escribe el nombre del cliente.';
      }

      if (campos.producto.value.trim() === '') {
        errores.producto = 'Escribe el producto.';
      }

      const kg = parseFloat(campos.kg.value);
      if (campos.kg.value.trim() === '' || isNaN(kg)) {
        errores.kg = 'Escribe la cantidad en kg.';
      } else if (kg <= 0) {
        errores.kg = 'La cantidad debe ser mayor que 0.';
      }

      if (campos.fecha.value === '') {
        errores.fecha = 'Elige la fecha de recogida.';
      }

      return errores;
    }

    // ---------- Crear y guardar encargo ----------
    function crearEncargo() {
      return {
        id: generarId(),
        nombre: campos.nombre.value.trim(),
        telefono: campos.telefono.value.trim(),
        tienda: campos.tienda.value,
        producto: campos.producto.value.trim(),
        kg: parseFloat(campos.kg.value),
        fechaRecogida: campos.fecha.value,
        senalPagada: campos.senal.checked,
        estado: 'Pendiente',
        fechaCreacion: new Date().toISOString()
      };
    }

    function limpiarFormulario() {
      formulario.reset();
      CAMPOS_VALIDADOS.forEach(limpiarError);
    }

    // ---------- Lista ----------
    function ordenarPorRecogida(lista) {
      return [...lista].sort((a, b) =>
        a.fechaRecogida.localeCompare(b.fechaRecogida) ||
        a.fechaCreacion.localeCompare(b.fechaCreacion)
      );
    }

    function pintarEncargo(encargo) {
      const senal = encargo.senalPagada
        ? '<span class="senal-si">Sí</span>'
        : '<span class="senal-no">No</span>';
      const telefono = encargo.telefono
        ? escaparHtml(encargo.telefono)
        : '—';
      const kg = encargo.kg.toLocaleString('es-ES', { maximumFractionDigits: 3 });

      return `
        <li class="encargo">
          <label class="fila-seleccion">
            <input type="checkbox" class="seleccion" data-id="${escaparHtml(encargo.id)}" ${seleccionados.has(encargo.id) ? 'checked' : ''}>
            Seleccionar para borrar
          </label>
          <div class="encargo-cabecera">
            <strong>${escaparHtml(encargo.nombre)}</strong>
            <span class="fecha">${formatearFecha(encargo.fechaRecogida)}</span>
          </div>
          <p class="encargo-detalle">${escaparHtml(encargo.producto)} · ${kg} kg</p>
          <p class="encargo-detalle">Tienda: ${escaparHtml(encargo.tienda)} · Tel: ${telefono}</p>
          <p class="encargo-detalle">Señal pagada: ${senal}</p>
          <span class="etiqueta-estado">${escaparHtml(encargo.estado)}</span>
        </li>
      `;
    }

    function pintarLista() {
      const ordenados = ordenarPorRecogida(encargos);
      lista.innerHTML = ordenados.map(pintarEncargo).join('');
      contador.textContent = encargos.length;
      vacio.hidden = encargos.length > 0;
      actualizarBarra();
    }

    // ---------- Selección y borrado ----------
    function actualizarBarra() {
      const n = seleccionados.size;
      btnBorrar.textContent = 'Borrar seleccionados (' + n + ')';
      btnBorrar.disabled = n === 0;
      if (n === 0) confirmacion.hidden = true;
    }

    function borrarSeleccionados() {
      const anterior = encargos;
      encargos = encargos.filter((encargo) => !seleccionados.has(encargo.id));
      if (!guardarEncargos()) {
        encargos = anterior;
        aviso.textContent = 'No se pudo actualizar la lista. Inténtalo de nuevo.';
        return;
      }
      seleccionados.clear();
      confirmacion.hidden = true;
      aviso.textContent = '';
      pintarLista();
    }

    // ---------- Eventos ----------
    formulario.addEventListener('submit', (evento) => {
      evento.preventDefault();
      aviso.textContent = '';

      CAMPOS_VALIDADOS.forEach(limpiarError);
      const errores = validarFormulario();
      const nombresConError = Object.keys(errores);

      if (nombresConError.length > 0) {
        nombresConError.forEach((campo) => mostrarError(campo, errores[campo]));
        campos[nombresConError[0]].focus();
        return;
      }

      encargos.push(crearEncargo());

      if (!guardarEncargos()) {
        encargos.pop();
        aviso.textContent = 'No se pudo guardar el encargo. Revisa el espacio o los permisos del navegador.';
        return;
      }

      limpiarFormulario();
      pintarLista();
      campos.nombre.focus();
    });

    // Al escribir de nuevo en un campo, se quita su error
    CAMPOS_VALIDADOS.forEach((nombre) => {
      campos[nombre].addEventListener('input', () => limpiarError(nombre));
      campos[nombre].addEventListener('change', () => limpiarError(nombre));
    });

    lista.addEventListener('change', (evento) => {
      const casilla = evento.target;
      if (!casilla.classList.contains('seleccion')) return;
      const id = casilla.dataset.id;
      if (casilla.checked) {
        seleccionados.add(id);
      } else {
        seleccionados.delete(id);
      }
      actualizarBarra();
    });

    btnBorrar.addEventListener('click', () => {
      confirmacion.hidden = false;
    });

    btnConfirmarBorrar.addEventListener('click', borrarSeleccionados);

    btnCancelarBorrar.addEventListener('click', () => {
      confirmacion.hidden = true;
    });

    // ---------- Arranque: pintar los encargos guardados ----------
    pintarLista();

    // ---------- Modo sin conexión (solo funciona en https) ----------
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch((error) => console.error('No se pudo activar el modo sin conexión:', error));
      });
    }
  </script>

</body>
</html>
